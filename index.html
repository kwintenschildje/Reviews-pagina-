
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KwintenYT Reviews</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #181818;
  padding: 18px;
  font-size: 23px;
  font-weight: bold;
}
header span { color: #ff0033; }
main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}
.logo {
  display: block;
  width: 190px;
  max-width: 75%;
  margin: 25px auto;
}
h1, .intro { text-align: center; }
.intro { color: #aaa; }
.box, .review {
  background: #202020;
  padding: 20px;
  border-radius: 15px;
  margin: 20px 0;
}
input, textarea {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #444;
  border-radius: 9px;
  background: #303030;
  color: white;
  font-size: 16px;
}
textarea { min-height: 110px; }
.stars {
  font-size: 36px;
  color: #ffcc00;
}
.stars span { cursor: pointer; }
button {
  background: #ff0033;
  color: white;
  border: none;
  padding: 14px 22px;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
}
.rating { color: #ffcc00; }
footer {
  text-align: center;
  color: #888;
  padding: 25px;
}
</style>
</head>
<body>

<header>
<span>▶ YouTube</span> KwintenYT Reviews
</header>

<main>

<img src="logo.webp" class="logo" alt="KwintenYT logo">

<h1>Welkom bij KwintenYT!</h1>

<p class="intro">
Wat vind jij van mijn YouTube-kanaal?
Laat hieronder een review achter!
</p>

<div class="box">
<h2>⭐ Geef jouw beoordeling</h2>

<input id="name" placeholder="Jouw naam">

<p>Kies jouw sterren:</p>

<div class="stars" id="stars">
<span onclick="rate(1)">☆</span>
<span onclick="rate(2)">☆</span>
<span onclick="rate(3)">☆</span>
<span onclick="rate(4)">☆</span>
<span onclick="rate(5)">☆</span>
</div>

<textarea id="message"
placeholder="Schrijf jouw reactie..."></textarea>

<button onclick="addReview()">
Reactie plaatsen
</button>
</div>

<h2>💬 Reacties van bezoekers</h2>
<div id="reviews"></div>

</main>

<footer>© 2026 KwintenYT</footer>

<script>
let rating = 0;

function rate(n) {
  rating = n;
  document.querySelectorAll("#stars span")
  .forEach((star, i) => {
    star.textContent = i < n ? "★" : "☆";
  });
}

function addReview() {
  const name = document.getElementById("name").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!name || !message || !rating) {
    alert("Vul je naam, reactie en sterren in!");
    return;
  }

  const reviews = JSON.parse(
    localStorage.getItem("kwintenReviews") || "[]"
  );

  reviews.unshift({name, message, rating});

  localStorage.setItem(
    "kwintenReviews",
    JSON.stringify(reviews)
  );

  document.getElementById("name").value = "";
  document.getElementById("message").value = "";
  rating = 0;
  rate(0);
  showReviews();
}

function showReviews() {
  const reviews = JSON.parse(
    localStorage.getItem("kwintenReviews") || "[]"
  );

  const area = document.getElementById("reviews");
  area.replaceChildren();

  reviews.forEach(r => {
    const div = document.createElement("div");
    div.className = "review";

    const title = document.createElement("strong");
    title.textContent = "👤 " + r.name;

    const stars = document.createElement("p");
    stars.className = "rating";
    stars.textContent = "★".repeat(r.rating);

    const message = document.createElement("p");
    message.textContent = r.message;

    div.append(title, stars, message);
    area.appendChild(div);
  });
}

showReviews();
</script>

</body>
</html>
